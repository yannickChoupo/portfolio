services:
  portfolio-db:
    env_file:
      - .env
    container_name: portfolio-db
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"   # optional: keep DB local-only on droplet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - portfolio_db_data:/data/db
    networks:
      - portfolio_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      timeout: 20s
      retries: 10

  portfolio-server:
    env_file:
      - .env
    container_name: portfolio-server
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
    ports:
      - "127.0.0.1:5000:5000"     # only system nginx can reach it
    depends_on:
      portfolio-db:
        condition: service_healthy
    networks:
      - portfolio_network

  portfolio-client:
    env_file:
      - .env
    container_name: portfolio-client
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        PUBLIC_URL: ${PUBLIC_URL}
    restart: unless-stopped
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - /app/node_modules
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - portfolio-server
    networks:
      - portfolio_network

networks:
  portfolio_network:
    driver: bridge

volumes:
  portfolio_db_data:
