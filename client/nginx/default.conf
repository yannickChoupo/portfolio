upstream api {
  server portfolio-server:5000;
}

server {
  listen 80;
  server_name njiloportfolio.de www.njiloportfolio.de;

  # If you already have SSL, you can redirect:
  # return 301 https://$host$request_uri;

  root /usr/share/nginx/html;
  index index.html;

  # React app
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Node API
  location ^~ /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Drupal (only if you still run Drupal on host nginx, not in container)
  # If Drupal is containerized too, we can proxy here similarly.
}
