name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - client
          - server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  publish:
    if: github.ref == 'refs/heads/master'
    name: Publish images
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/portfolio:server-${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/portfolio:server-latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and publish client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_UNION_APP_URL=https://app.union.njiloportfolio.de/#/login
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/portfolio:client-${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/portfolio:client-latest
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy SHA-tagged images
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.SERVER_PATH }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          timeout: 30s
          command_timeout: 10m
          envs: DEPLOY_PATH,DOCKER_USERNAME,IMAGE_TAG
          script: |
            set -eu
            cd "${DEPLOY_PATH:-/var/www/html}"

            test -f docker-compose.yml

            server_image="$DOCKER_USERNAME/portfolio:server-$IMAGE_TAG"
            client_image="$DOCKER_USERNAME/portfolio:client-$IMAGE_TAG"

            docker pull "$server_image"
            docker pull "$client_image"
            docker tag "$server_image" "$DOCKER_USERNAME/portfolio:server-latest"
            docker tag "$client_image" "$DOCKER_USERNAME/portfolio:client-latest"

            docker compose --profile portfolio up -d --no-deps --force-recreate portfolio-server portfolio-client

            attempts=0
            until docker compose --profile portfolio exec -T portfolio-server node -e \
              "fetch('http://127.0.0.1:5000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 12 ]; then
                docker compose --profile portfolio logs --tail=100 portfolio-server
                exit 1
              fi
              sleep 5
            done

            docker compose --profile portfolio ps portfolio-server portfolio-client
