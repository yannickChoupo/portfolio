services:
  portfolio-client-dev:
    container_name: portfolio-client-dev
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - /app/node_modules
    env_file:
      - ./.env.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: ${NODE_ENV}
      REACT_APP_API_URL: ${REACT_APP_API_URL}
    depends_on:
      - portfolio-server-dev
    networks:
      portfolio_network:
        aliases:
          - portfolio-client-dev

  portfolio-server-dev:
    container_name: portfolio-server-dev
    env_file:
      - ./.env.dev
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    working_dir: /usr/src/app
    ports:
      - "5000:5000"
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
    depends_on:
      portfolio-db-dev:
        condition: service_healthy
    networks:
      portfolio_network:
        aliases:
          - portfolio-server-dev

  portfolio-db-dev:
    container_name: portfolio-db-dev
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - ./.env.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASS: ${MONGO_APP_PASS}
    volumes:
      - portfolio_dev_db_data:/data/db
      - ./server/mongodb/mongo-init-dev.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      portfolio_network:
        aliases:
          - portfolio-db-dev
    healthcheck:
      test: >
        mongosh "mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@portfolio-db-dev:27017/admin?authSource=admin" --eval "db.runCommand({ ping: 1 }).ok" --quiet
      # interval: 5s
      # timeout: 5s
      # retries: 10
