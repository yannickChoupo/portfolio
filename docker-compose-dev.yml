services:
  client:
    container_name: client-dev
    image: client-dev
    working_dir: /app
    build: 
      context: ./client
      dockerfile: Dockerfile-dev
    ports:
      - 3000:3000
    volumes:
      - ./client/src:/app/src
      - /app/node_modules
    depends_on:
      - server
    env_file: 
      - ./.env.dev
    
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    networks:
      - portfolio_network
      
  server:
    container_name: server-dev
    build:
      context: ./server
      dockerfile: Dockerfile-dev
    ports:
      - 5000:5000
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file: 
      - ./.env.dev
    networks:
      - portfolio_network
    depends_on:
      mongo:
        condition: service_healthy

  
  mongo:
    image: mongo:7
    container_name: portfolio-db-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - portfolio_db_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/config.js:ro
    networks:
      portfolio_network:
        aliases:
          - mongo
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ./.env.dev
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - portfolio_network

volumes:
  portfolio_db_data:

networks:
  portfolio_network:
    driver: bridge