services:
  client:
    container_name: client-dev
    build:
      context: ./client
      dockerfile: Dockerfile-dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - /app/node_modules
    env_file:
      - ./.env.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    depends_on:
      - server
    networks:
      - portfolio_network

  server:
    container_name: server-dev
    build:
      context: ./server
      dockerfile: Dockerfile-dev
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./.env.dev
    environment:
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - portfolio_network

  mongo:
    image: mongo:7
    container_name: portfolio-db-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - ./.env.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-portfolio}
    volumes:
      - portfolio_db_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - portfolio_network
    healthcheck:
      test: >
        mongosh "mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@localhost:27017/admin?authSource=admin"
        --eval "db.runCommand({ ping: 1 }).ok" --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ./.env.dev
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin123}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - portfolio_network

volumes:
  portfolio_db_data:

networks:
  portfolio_network:
    driver: bridge
